<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireStorm Royale - Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #1a1a1a; color: white; }
        .sidebar { background-color: #333; min-height: 100vh; padding: 20px; }
        .card { background-color: #444; color: white; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar">
                <h3>FireStorm Admin</h3>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white" href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Manage Players</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Game Statistics</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Monetization</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Events</a></li>
                </ul>
            </nav>
            <main class="col-md-10 p-4">
                <h2>Dashboard Overview</h2>
                <div class="row mt-4">
                    <div class="col-md-3">
                        <div class="card p-3">
                            <h4>Active Players</h4>
                            <p id="active-players">1,234</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3">
                            <h4>Daily Revenue</h4>
                            <p id="daily-revenue">$5,678</p>
                        </div>
                    </div>
                </div>
                <div class="mt-5">
                    <h3>Recent Player Activity</h3>
                    <table class="table table-dark table-striped">
                        <thead>
                            <tr>
                                <th>UID</th>
                                <th>Username</th>
                                <th>Rank</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="player-table">
                            <!-- Populated by admin.js -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
